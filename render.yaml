services:
  - type: web
    name: surevy_pepperwahl
    runtime: python
    rootDir: Backend
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2 --preload
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
