<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="50%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <!-- Red accent glow -->
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e8503a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e8503a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#16161f" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Brand pill gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8503a"/>
      <stop offset="100%" stop-color="#ff7c5c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="980" cy="120" r="180" fill="none" stroke="#e8503a" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="980" cy="120" r="120" fill="none" stroke="#e8503a" stroke-opacity="0.06" stroke-width="1"/>
  <circle cx="160" cy="520" r="130" fill="none" stroke="#e8503a" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Main card -->
  <rect x="80" y="80" width="760" height="470" rx="20" fill="url(#cardGrad)" stroke="#e8503a" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Brand pill (top left of card) -->
  <rect x="120" y="120" width="160" height="32" rx="16" fill="url(#pillGrad)"/>
  <text x="200" y="141" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1.5">PEPPERWAHL</text>

  <!-- AI badge -->
  <rect x="295" y="120" width="74" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <text x="332" y="141" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">AI ✦</text>

  <!-- Main headline -->
  <text x="120" y="228" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1">Quick Survey</text>
  <!-- Red accent word -->
  <text x="120" y="292" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="800" fill="#e8503a" letter-spacing="-1">2 Minutes.</text>
  <!-- Subtext line -->
  <text x="120" y="344" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="800" fill="white" fill-opacity="0.85" letter-spacing="-1">Real Impact.</text>

  <!-- Description -->
  <text x="120" y="398" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="400" fill="#9ca3af">Share your feedback. Every response makes a difference.</text>

  <!-- CTA button -->
  <rect x="120" y="432" width="200" height="50" rx="12" fill="#e8503a"/>
  <text x="220" y="462" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle" letter-spacing="0.3">Take Survey →</text>

  <!-- Stat pills (right side of card) -->
  <rect x="560" y="200" width="220" height="80" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="670" y="235" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="#e8503a" text-anchor="middle">10K+</text>
  <text x="670" y="262" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="500" fill="#6b7280" text-anchor="middle">Surveys Created</text>

  <rect x="560" y="296" width="220" height="80" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="670" y="331" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="#e8503a" text-anchor="middle">AI-Powered</text>
  <text x="670" y="358" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="500" fill="#6b7280" text-anchor="middle">Smart Questions</text>

  <rect x="560" y="392" width="220" height="80" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="670" y="427" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="#e8503a" text-anchor="middle">Free</text>
  <text x="670" y="454" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="500" fill="#6b7280" text-anchor="middle">No Sign-up Needed</text>

  <!-- Bottom domain bar -->
  <rect x="80" y="558" width="760" height="2" rx="1" fill="url(#pillGrad)" fill-opacity="0.4"/>
  <text x="120" y="598" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="500" fill="#6b7280">survey.pepperwahl.com</text>
  <circle cx="740" cy="590" r="5" fill="#e8503a"/>
  <text x="752" y="596" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#9ca3af">Powered by AI</text>

  <!-- Right side decorative dots pattern -->
  <g fill="#e8503a" fill-opacity="0.15">
    <circle cx="920" cy="320" r="4"/>
    <circle cx="960" cy="320" r="4"/>
    <circle cx="1000" cy="320" r="4"/>
    <circle cx="1040" cy="320" r="4"/>
    <circle cx="920" cy="360" r="4"/>
    <circle cx="960" cy="360" r="4"/>
    <circle cx="1000" cy="360" r="4"/>
    <circle cx="1040" cy="360" r="4"/>
    <circle cx="920" cy="400" r="4"/>
    <circle cx="960" cy="400" r="4"/>
    <circle cx="1000" cy="400" r="4"/>
    <circle cx="1040" cy="400" r="4"/>
    <circle cx="920" cy="440" r="4"/>
    <circle cx="960" cy="440" r="4"/>
    <circle cx="1000" cy="440" r="4"/>
    <circle cx="1040" cy="440" r="4"/>
  </g>

  <!-- Logo circle in bottom right -->
  <circle cx="1100" cy="500" r="64" fill="#e8503a" fill-opacity="0.1" stroke="#e8503a" stroke-opacity="0.2" stroke-width="1.5"/>
  <text x="1100" y="508" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="900" fill="#e8503a" text-anchor="middle">PW</text>
</svg>
